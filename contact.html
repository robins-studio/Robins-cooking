<main>
  <div class="wrap">
    <div class="pagehead">
      <h1>Contact</h1>
      <p>Got a question about a recipe, or a dish you’d like to see? Send me a note, or find me on Instagram at <a href="https://www.instagram.com/robins.cooking" target="_blank" rel="noopener noreferrer">@robins.cooking</a>.</p>
    </div>
    <form id="form">
      <label>Your name<input name="name" required autocomplete="name"></label>
      <label>Email<input name="email" type="email" required autocomplete="email"></label>
      <label>Topic
        <select name="topic"><option>Recipe question</option><option>Recipe request</option><option>Collaboration</option><option>Something else</option></select>
      </label>
      <label>Message<textarea name="message" required></textarea></label>
      <input type="text" name="_honey" tabindex="-1" autocomplete="off" aria-hidden="true" style="display:none">
      <button class="btn" type="submit">Send message</button>
    </form>
    <div class="ok" id="ok" role="status"></div>
  </div>
</main>
